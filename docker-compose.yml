---
# Services: postgres (required), prefect-server + prefect-worker (required),
# and llama-server (optional, for local LLM inference via OpenAI-compatible API).
# bot, dashboard, and other Phase 2+ services are added as tracks exist
# (tech design §2.7/§2.8) — no Kubernetes, single host throughout.
#
# To use llama-server locally: uncomment the llama-server service below and set
# LLAMA_SERVER_URL=http://llama-server:8080 in .env (or your local URL if running
# separately, e.g. http://dietpi.eland-platy.ts.net:8082 if running on another host).

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    ports:
      - "5433:5432"  # host 5433 to avoid clashing with other local postgres instances on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres runs *.sql files here once, only on an empty data dir (first
      # boot) — this is what applies schema + seeds, not the app itself.
      - ./sql/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/seeds/002_source_registry_phase1.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge"]
      interval: 5s
      timeout: 3s
      retries: 10

  prefect-server:
    image: prefecthq/prefect:3-latest
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    environment:
      PREFECT_SERVER_API_HOST: 0.0.0.0
    healthcheck:
      test: [
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')",
      ]
      interval: 10s
      timeout: 5s
      retries: 10

  prefect-worker:
    build: .
    command: prefect worker start --pool default-pool
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      POSTGRES_DSN: postgresql://knowledge:knowledge@postgres:5432/knowledge
    env_file:
      - .env

  # Optional: local LLM inference via llama.cpp/OpenAI-compatible API.
  # Uncomment to use; comment out if running llama-server separately.
  # llama-server:
  #   image: ghcr.io/ggerganov/llama.cpp:server-latest
  #   command:
  #     - "--model=/models/gemma-2-2b-it.gguf"
  #     - "--host=0.0.0.0"
  #     - "--port=8080"
  #     - "--n-gpu-layers=32"
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ~/.cache/huggingface/hub:/models
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10

volumes:
  pgdata:
