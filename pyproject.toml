[project]
name = "knowledge-app"
version = "0.1.0"
requires-python = ">=3.12"
# One dependency set for the whole app (LLD §0) — added incrementally as each
# phase's tickets land, not front-loaded. Phase 0 only needs what F-04/F-05/F-06
# actually import.
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "fastembed>=0.4",
    "httpx>=0.27",
    "feedparser>=6.0",    # Phase 1: RSS connectors
    "trafilatura>=1.6",   # Phase 1: text extraction
    "prefect>=3.0",       # Phase 1: orchestration
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",         # Phase 1 tests: async test support
    "responses>=0.24",              # Phase 1 tests: mock httpx/requests
    "freezegun>=1.5",               # Phase 1 tests: mock datetime
    "testcontainers>=4.0",          # Phase 1 tests: Docker containers for integration tests
    "mypy>=1.10",
    "pytype>=2024.10.11",
    "black>=24",
    "ruff>=0.6",
    "bandit>=1.7",
    "pylint>=3",     # pyreverse ships inside pylint, not a standalone package
    "radon>=6",
    "xenon>=0.9",    # radon's own CI-gating wrapper — pass/fail thresholds radon itself doesn't have
    "interrogate>=1.5",
    "vulture>=2.11",
    "pip-audit>=2.7",
    "tach>=0.35",
    "shellcheck-py>=0.10",  # pip wheel bundling the real shellcheck binary — no brew/apt needed
    "shfmt-py>=4.2",        # same, for the shfmt binary
    "sqlfluff>=4.3",
    "yamllint>=1.35",
    "pydeps>=1.11",                 # dependency graph visualization (imports)
    "dot-layered-transform>=1.0",   # architecture analysis (circular deps, layer violations)
    "skylos>=2.0",                  # comprehensive quality scanning (secrets, dead code, quality)
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
ignore_missing_imports = true

[tool.black]
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B101 (assert_used): this codebase's own convention is assert-based
# self-checks in one-off scripts and gates (ponytail style) — not a
# security concern here, so it'd be pure noise every time.
skips = ["B101"]

[tool.sqlfluff.core]
dialect = "postgres"  # plain DDL for now; revisit to "dbt" once dbt/ exists (Phase 4) and .sql is Jinja-templated
# LT01/LT02 fight this file's deliberate column alignment; verified via a
# real `sqlfluff fix` diff that its rewrite is a regression, not a style
# nit — it relocates trailing inline comments onto the wrong column
# (e.g. embedding's comment ends up read as key_entities's). LT05
# (line length) is too strict for documentation-heavy DDL comments.
# RF04 (keywords as identifiers) flags `key`/`value`/`action`/`summary` —
# real column names already used across every design doc and draft file;
# renaming now would ripple far outside CI-tooling scope for a portability
# concern this Postgres-only project doesn't have.
exclude_rules = "LT01,LT02,LT05,RF04"

[tool.interrogate]
# Ponytail style deliberately keeps docstrings sparse — only where the WHY
# isn't obvious from the code (see CLAUDE-level convention, not repeated
# here). This check is informational (see scripts/ci_check.sh), not a gate:
# fail-under is kept low so it reports the number without blocking CI.
fail-under = 0
exclude = [".venv", ".pytype", "dbt"]
ignore-init-module = true
ignore-magic = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pydeps]
# pydeps configuration for dependency visualization
exclude = ["tests", ".venv"]
max-bacon = 2  # limit to 2 hops (direct imports only)
rankdir = "TB"  # top-to-bottom layout

[tool.skylos]
# skylos configuration for comprehensive code quality scanning
exclude = ["tests", ".venv", "docs", "__pycache__"]
# Enable all audit categories
quality = true
secrets = true
dead_code = true
sca = true  # Software Composition Analysis (dependency vulnerabilities)
