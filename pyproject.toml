[project]
name = "knowledge-app"
version = "0.1.0"
requires-python = ">=3.12"
# One dependency set for the whole app (LLD §0) — added incrementally as each
# phase's tickets land, not front-loaded. Phase 0 only needs what F-04/F-05/F-06
# actually import.
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "fastembed>=0.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
plugins = ["pydantic.mypy"]
explicit_package_bases = true
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
